<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo – The Crafty Teckel & Garder3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Delius&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f2ea; --card:#fffdf9; --ink:#2b2433; --soft:#857a8d; --line:#ebe3d8;
    --g3d:#ff7a3d; --g3d2:#ffb02e; --g3dink:#2f1fbf;
    --tk:#cbd6a2; --tkdark:#3d2a1a; --tkgreen:#2f4a22;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  img,canvas{-webkit-user-drag:none;user-drag:none;-webkit-touch-callout:none}
  input{-webkit-user-select:text;user-select:text}
  .search{max-width:1100px;width:100%;margin:14px auto 0;padding:0 16px}
  .search label{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:0 14px;box-shadow:0 2px 10px rgba(43,36,51,.06);border:2px solid transparent}
  .search label:focus-within{border-color:var(--line)}
  .search svg{width:20px;height:20px;color:var(--soft);flex:none}
  .search input{flex:1;border:0;background:none;font:inherit;font-size:1rem;padding:13px 0;outline:none;color:var(--ink);min-width:0}
  .search .clear{font-size:1.2rem;color:var(--soft);width:28px;height:28px;border-radius:50%}
  .count{max-width:1100px;width:100%;margin:8px auto 0;padding:0 20px;color:var(--soft);font-size:.85rem}
  .item .pic canvas{position:relative;width:88%;height:88%;object-fit:contain}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .view{display:none;min-height:100%;flex-direction:column}
  .view.on{display:flex}

  /* ---------- MENÚ ---------- */
  #home{align-items:center;justify-content:center;padding:32px 20px 28px;gap:26px;
        background:radial-gradient(1200px 600px at 10% -10%,#ffe3cc 0,transparent 60%),radial-gradient(900px 600px at 110% 110%,#e3ead0 0,transparent 60%),var(--bg)}
  .logos{display:flex;align-items:center;gap:14px}
  .logos canvas{width:clamp(110px,30vw,170px);aspect-ratio:1;border-radius:28px;box-shadow:0 10px 30px rgba(43,36,51,.15);display:block}
  .logos .amp{font-size:2rem;font-weight:600;color:var(--soft)}
  .brand{text-align:center}
  .brand h1{font-size:clamp(1.5rem,5vw,2.2rem);font-weight:600;line-height:1.15}
  .brand h1 .tk{font-family:'Delius',cursive;color:var(--tkdark)}
  .brand h1 .g3{color:var(--g3dink)}
  .brand p{color:var(--soft);margin-top:6px}
  .menu{display:grid;gap:14px;width:min(520px,100%)}
  .opt{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:22px;background:var(--card);
       box-shadow:0 4px 16px rgba(43,36,51,.07);text-align:left;transition:transform .15s,box-shadow .15s;border:2px solid transparent}
  .opt:active{transform:scale(.98)}
  @media (hover:hover){.opt:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(43,36,51,.12)}}
  .opt .ic{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;flex:none}
  .opt .ic svg{width:32px;height:32px}
  .opt b{display:block;font-size:1.25rem;font-weight:600}
  .opt small{color:var(--soft);font-size:.92rem}
  .opt .arrow{margin-left:auto;color:var(--soft);font-size:1.4rem}
  .opt.o3d .ic{background:linear-gradient(135deg,var(--g3d),var(--g3d2));color:#fff}
  .opt.ores .ic{background:#dfe8c4;color:var(--tkgreen)}
  .opt.ocro .ic{background:#f3dfe4;color:#8a3d55}
  .foot{color:var(--soft);font-size:.9rem;text-align:center}
  .fs{margin-top:-8px;font-size:.85rem;color:var(--soft);text-decoration:underline;text-underline-offset:3px}

  /* ---------- BARRA ---------- */
  .bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(247,242,234,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .back{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 2px 8px rgba(43,36,51,.08);font-size:1.3rem;flex:none}
  .bar h2{font-size:1.3rem;font-weight:600;flex:1}
  .bar canvas{width:40px;height:40px;border-radius:12px}

  /* ---------- REJILLA ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding:18px 16px 32px;max-width:1100px;width:100%;margin:0 auto}
  .item{background:var(--card);border-radius:22px;padding:12px 12px 14px;text-align:left;box-shadow:0 3px 14px rgba(43,36,51,.06);transition:transform .15s}
  .item:active{transform:scale(.97)}
  .item .pic{aspect-ratio:1;border-radius:16px;display:grid;place-items:center;overflow:hidden;position:relative}
  .item .pic::before{content:"";position:absolute;inset:14%;border-radius:50%;background:var(--halo,#ffe7d4)}
  .item b{display:block;margin-top:10px;font-weight:600;font-size:1.05rem}
  .item small{color:var(--soft);font-size:.82rem}
  .badge3d{position:absolute;top:8px;right:8px;font-size:.7rem;font-weight:600;background:var(--ink);color:#fff;padding:3px 7px;border-radius:99px}
  .empty{margin:40px auto;max-width:420px;text-align:center;color:var(--soft);padding:0 24px;line-height:1.5}
  .empty .big{font-size:3rem;margin-bottom:8px}

  /* ---------- VISOR ---------- */
  #visor{height:100%;min-height:100dvh}
  #stage{flex:1;position:relative;min-height:50vh;touch-action:none}
  #stage canvas{position:absolute;z-index:1;inset:0;width:100%;height:100%;display:block}
  #stage .halo{position:absolute;z-index:0;left:50%;top:50%;width:min(80vw,62vh);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#ffe7d4 0,rgba(255,231,212,0) 70%)}
  #loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--soft);font-size:1.05rem;z-index:2}
  .hint{position:absolute;z-index:2;bottom:10px;left:0;right:0;text-align:center;font-size:.85rem;color:var(--soft);pointer-events:none;transition:opacity .6s}
  .nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:rgba(255,253,249,.9);box-shadow:0 2px 10px rgba(43,36,51,.12);font-size:1.4rem;display:grid;place-items:center;z-index:3}
  .nav.prev{left:12px}.nav.next{right:12px}
  .info{background:var(--card);border-radius:26px 26px 0 0;padding:20px 22px 26px;box-shadow:0 -6px 24px rgba(43,36,51,.08)}
  .info .inner{max-width:720px;margin:0 auto}
  .tag{display:inline-block;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--g3d);padding:4px 10px;border-radius:99px}
  .info h3{font-size:1.7rem;font-weight:600;margin:8px 0 4px}
  .info p{color:var(--soft);line-height:1.45}
  .swatches{display:flex;gap:8px;margin-top:12px;align-items:center}
  .swatches span{width:22px;height:22px;border-radius:50%;border:2px solid var(--line)}
  .swatches em{font-style:normal;font-size:.82rem;color:var(--soft);margin-left:4px}
  .photo{position:relative;flex:1;display:grid;place-items:center;padding:16px 64px;min-height:300px;height:52vh}
  .photo canvas{position:absolute;left:64px;right:64px;top:16px;bottom:16px;width:calc(100% - 128px);height:calc(100% - 32px);filter:drop-shadow(0 14px 22px rgba(43,36,51,.18))}
  .price{font-size:1.35rem;font-weight:600;color:var(--tkgreen);margin:2px 0 8px}
  .vlabel{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);margin:14px 0 8px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:8px 14px;border-radius:99px;background:var(--bg);border:2px solid var(--line);font-size:.95rem;transition:all .15s}
  .chip.on{background:var(--tkgreen);border-color:var(--tkgreen);color:#fff}
  .shop{display:inline-flex;align-items:center;gap:6px;margin-top:16px;padding:10px 16px;border-radius:14px;background:var(--tkdark);color:#fff;text-decoration:none;font-weight:500}
  .item .meta{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-top:2px}
  .item .meta em{font-style:normal;font-weight:600;color:var(--tkgreen);font-size:.92rem;white-space:nowrap}
  .vcount.izq{left:8px;right:auto;background:#7a4bd6}
  .vcount{position:absolute;top:8px;right:8px;font-size:.7rem;font-weight:600;background:var(--tkgreen);color:#fff;padding:3px 8px;border-radius:99px}
  .screens{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
  .scr{flex:none;width:62px;height:62px;border-radius:12px;border:3px solid var(--line);background:#fff;padding:3px;scroll-snap-align:start}
  .scr canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
  .scr.on{border-color:var(--g3d)}
  .opt3d{display:flex;flex-wrap:wrap;gap:8px}
  .opt3d .chip.on{background:var(--g3d);border-color:var(--g3d)}
  .focus{position:absolute;z-index:3;right:12px;bottom:34px;padding:8px 14px;border-radius:99px;background:rgba(255,253,249,.92);box-shadow:0 2px 10px rgba(43,36,51,.12);font-size:.88rem;font-weight:500}
  .chip .dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.15)}
  .basebadge{font-size:.85rem;color:var(--soft);margin-top:10px}
  .descargas{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .descargas a{padding:8px 12px;border-radius:12px;background:var(--bg);border:2px solid var(--line);color:var(--ink);text-decoration:none;font-size:.9rem;font-weight:500}
  .credit{font-size:.8rem;color:var(--soft);margin-top:14px}
</style>
<script src="assets.js"></script>
<script src="catalogo-tienda.js"></script>

function pinta(canvas, src, max=420, caja=false){  // las imágenes se dibujan en canvas: sin "guardar imagen"
  const draw = im => {
    if (caja) {                                     // ajusta la imagen centrada dentro del hueco del canvas
      const dpr = Math.min(devicePixelRatio || 1, 2), W = Math.max(1, canvas.clientWidth * dpr), H = Math.max(1, canvas.clientHeight * dpr);
      canvas.width = W; canvas.height = H;
      const r = Math.min(W / im.width, H / im.height), w = im.width * r, hh = im.height * r;
      const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, W, H); ctx.drawImage(im, (W - w) / 2, (H - hh) / 2, w, hh);
      return;
    }
    const r = Math.min(1, max/Math.max(im.width, im.height));
    canvas.width = im.width*r; canvas.height = im.height*r;
    canvas.getContext('2d').drawImage(im, 0, 0, canvas.width, canvas.height); };
  if (imgCache[src]) return draw(imgCache[src]);

}

let renderer, scene, camera, controls, current, shadow, idle, anim = null;

const cache = {};
function init3D(){
  if (renderer) return;
  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  $('stage').prepend(renderer.domElement);
  scene = new THREE.Scene();
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
  const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(2,4,3); scene.add(sun);
  camera = new THREE.PerspectiveCamera(32, 1, 0.01, 5000);
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.enablePan = false; controls.autoRotateSpeed = 2.2;
  controls.addEventListener('start', () => { anim = null; controls.autoRotate = false; clearTimeout(idle); $('hint').style.opacity = 0; });
  controls.addEventListener('end', () => { if (!kitFoco) idle = setTimeout(() => controls.autoRotate = true, 3000); });
  shadow = new THREE.Mesh(new THREE.CircleGeometry(1,48), new THREE.MeshBasicMaterial({ color:0x2b2433, transparent:true, opacity:.08, depthWrite:false }));
  shadow.rotation.x = -Math.PI/2; scene.add(shadow);
  new ResizeObserver(resize).observe($('stage')); resize();
  renderer.setAnimationLoop(() => {
    if (!(views.visor.classList.contains('on') && current)) return;
    if (anim) {
      const t = Math.min(1, (performance.now() - anim.t0) / anim.dur), e = t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
      camera.position.lerpVectors(anim.p0, anim.p1, e); controls.target.lerpVectors(anim.c0, anim.c1, e);

    }

    if (Math.abs(nr - camera.near) > nr * 0.1) { camera.near = nr; camera.far = Math.max(5000, dist * 50); camera.updateProjectionMatrix(); }
    renderer.render(scene, camera);

}
function resize(){
  const st = $('stage'), w = st.clientWidth, h = st.clientHeight; if (!w || !h) return;

function loadScript(src){
  return new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = ko; document.head.appendChild(s); });
}
async function getModel(id){
  if (cache[id]) return cache[id];
  if (!(window.__m && window.__m[id])) await loadScript('modelo-'+id+'.js');
  const buf = Uint8Array.from(atob(window.__m[id]), c => c.charCodeAt(0));
  delete window.__m[id];
  const key = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(K() + id)));
  for (let i = 0; i < buf.length; i++) buf[i] ^= key[i & 31];
  const bin = buf.buffer;
  const g = await new Promise((ok, ko) => new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).parse(bin, '', ok, ko));
  g.scene.traverse(o => { if (o.isMesh) { if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals(); o.material.side = THREE.DoubleSide; } });
  return cache[id] = g.scene;
}
let token = 0;
async function show3D(id){
  init3D(); resize();
  const my = ++token; kitFoco = false; anim = null; $('focusBtn').hidden = true;
  if (current) { scene.remove(current); current = null; }
  $('loading').hidden = false; $('loading').textContent = 'Cargando modelo…';
  try {
    const obj = await getModel(id);
    if (my !== token) return;
    current = obj; scene.add(obj);
    const box = new THREE.Box3().setFromObject(obj), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
    const R = size.length()/2;
    shadow.scale.setScalar(Math.max(size.x, size.z)*.48); shadow.position.set(c.x, box.min.y+.01, c.z);
    controls.target.copy(c);
    const d = R / Math.sin(THREE.MathUtils.degToRad(16)) * 1.05;
    camera.position.set(c.x + d*.3, c.y + d*.18, c.z + d*.94);
    controls.minDistance = d*.45; controls.maxDistance = d*2.2;
    rotarLuego(); controls.update();
    $('loading').hidden = true;
  } catch(e) { if (my === token) $('loading').textContent = 'No se pudo cargar el modelo'; }
}

  moverCamara(new THREE.Vector3(hx + 8, hy + 12, top + 80), new THREE.Vector3(hx, hy, top));
  $('focusBtn').textContent = '↩︎ Ver entero';
}
function pintaTira(it){
  const g = window.NG.grupos[kitEstado.grupo];
  $('kitPantallas').innerHTML = '';
  g.ids.forEach((pid, j) => {
    const b = document.createElement('button'); b.className = 'scr' + (pid === kitEstado.pant ? ' on' : ''); b.setAttribute('aria-label', g.nombre + ' ' + (j+1));
    b.innerHTML = '<canvas></canvas>'; pinta(b.firstChild, window.NG.thumbs[pid], 128);
    b.onclick = () => { kitEstado.pant = pid; [...$('kitPantallas').children].forEach(x => x.classList.toggle('on', x === b)); ponPantalla(); vistaPantalla(); etiquetaPantalla(); };
    $('kitPantallas').appendChild(b);
  });
  etiquetaPantalla();
}
function etiquetaPantalla(){
  const g = window.NG.grupos[kitEstado.grupo], j = g.ids.indexOf(kitEstado.pant);
  $('kitPLabel').textContent = (kitActual.etiquetaP || 'Pantallas') + ' · ' + g.nombre + (j >= 0 ? ' · ' + (j+1) + ' de ' + g.ids.length : ' · ' + g.ids.length);
}
async function showKit(it){
  init3D(); resize();
  const my = ++token;
  if (current) { scene.remove(current); current = null; }
  $('loading').hidden = false; $('loading').textContent = 'Cargando modelo…';
  try {
    if (!window.NG) await loadScript('ngotchi-datos.js');
    if (it.datos && !datosCargados[it.datos]) { await loadScript(it.datos); datosCargados[it.datos] = true; }
    if (my !== token) return;
    kitActual = it;
    kitEstado = kitMem[it.id] = kitMem[it.id] || { base: it.bases[0].modelo, tinte: it.bases[0].tinte || null, grupo: gruposDe(it, it.bases[0].modelo)[0], pant: null };
    if (!kitEstado.pant) kitEstado.pant = window.NG.grupos[kitEstado.grupo].ids[0];
    $('kitBLabel').textContent = it.etiquetaB || 'Dispositivo';
    $('kitBox').hidden = false;
    $('kitBases').innerHTML = '';
    it.bases.forEach(bs => { const ch = document.createElement('button'); ch.className = 'chip' + (bs.modelo === kitEstado.base && (bs.tinte || null) === (kitEstado.tinte || null) ? ' on' : '');
      if (bs.color || bs.tinte) { const d = document.createElement('span'); d.className = 'dot'; d.style.background = bs.tinte || bs.color; ch.appendChild(d); }
      ch.appendChild(document.createTextNode(bs.nombre));
      ch.onclick = () => { kitEstado.base = bs.modelo; kitEstado.tinte = bs.tinte || null; [...$('kitBases').children].forEach(x => x.classList.toggle('on', x === ch));
        const gs = gruposDe(it, bs.modelo);
        if (!gs.includes(kitEstado.grupo)) { kitEstado.grupo = gs[0]; kitEstado.pant = window.NG.grupos[gs[0]].ids[0]; }
        pintaGrupos(it); pintaTira(it); montaKit(false); }; $('kitBases').appendChild(ch); });
    pintaGrupos(it);
    pintaTira(it);
    $('focusBtn').hidden = false;
    $('focusBtn').onclick = () => kitFoco ? vistaGeneral() : vistaPantalla();
    await montaKit(true, my);
  } catch(e) { console.error(e); if (my === token) $('loading').textContent = 'No se pudo cargar el modelo'; }
}
const datosCargados = {};
const gruposDe = (it, base) => it.grupos.filter(g => !window.NG.grupos[g].base || window.NG.grupos[g].base === base);
const txtVer = () => '🔍 Ver la ' + (kitActual && kitActual.etiquetaP ? kitActual.etiquetaP.toLowerCase().replace(/s$/, '') : 'pantalla');
function pintaGrupos(it){
    const gs = gruposDe(it, kitEstado.base);
    $('kitGrupos').innerHTML = ''; $('kitGrupos').hidden = gs.length < 2;
    gs.forEach(gid => { const ch = document.createElement('button'); ch.className = 'chip' + (gid === kitEstado.grupo ? ' on' : '');
      ch.textContent = window.NG.grupos[gid].nombre + ' (' + window.NG.grupos[gid].ids.length + ')';
      ch.onclick = () => { kitEstado.grupo = gid; [...$('kitGrupos').children].forEach(x => x.classList.toggle('on', x === ch)); pintaTira(it); $('kitPantallas').scrollLeft = 0; }; $('kitGrupos').appendChild(ch); });
}
let kitGrupo = null, kitPantalla = null;
let kitBase = null;
function tiñe(obj, de, a){   // cambia un color de la base (naranja del Digivice, gris de los cartuchos) por el elegido; '*' = acabado brillante
  if (!de || !obj) return;
  const ref = new THREE.Color(de), brillo = !!a && a.endsWith('*'), col = a ? new THREE.Color(a.replace('*', '')) : null;
  obj.traverse(o => { if (!o.isMesh) return;
    if (!o.userData.c0) { o.material = o.material.clone(); o.userData.c0 = o.material.color.clone(); o.userData.r0 = o.material.roughness; o.userData.m0 = o.material.metalness; }
    const c0 = o.userData.c0, d = Math.abs(c0.r - ref.r) + Math.abs(c0.g - ref.g) + Math.abs(c0.b - ref.b), hit = col && d < 0.06;
    o.material.color.copy(hit ? col : c0);
    o.material.roughness = hit && brillo ? 0.22 : o.userData.r0; o.material.metalness = hit && brillo ? 0.45 : o.userData.m0; });
}
function aplicaTinte(){
  const db = datosBase();
  if (db && db.gris) tiñe(kitBase, db.gris, (window.NG.tinte || {})[kitEstado.pant]);
  else tiñe(kitBase, kitActual && kitActual.tinteDe, kitEstado.tinte);
}
function ponPantalla(){
  if (!kitPantalla) return;
  const b = datosBase(), sz = plantillaKit().size;
  kitPantalla.position.set(b.hueco[0], b.hueco[1], (b.rimZ ?? b.huecoTop) + (b.saliente ?? SALIENTE) - sz[2]/2);
  const map = texPantalla(kitEstado.pant);
  kitPantalla.traverse(o => { if (o.isMesh) { o.material.map = map; o.material.color.set(0xffffff); o.material.needsUpdate = true; } });
  aplicaTinte();
}
async function montaKit(primera, my = token){
  $('loading').hidden = false;
  const pid = plantillaId();
  const [base, plant] = await Promise.all([getModel(kitEstado.base), getModel(pid)]);
  if (my !== token) return;
  kitBase = base;
  if (!kitGrupo) kitGrupo = new THREE.Group();
  kitGrupo.clear();
  if (kitPantalla && kitPantalla.userData.pid !== pid) kitPantalla = null;
  if (!kitPantalla) { kitPantalla = plant.clone(true); kitPantalla.rotation.y = Math.PI; kitPantalla.userData.pid = pid;
    kitPantalla.traverse(o => { if (o.isMesh) o.material = o.material.clone(); }); }
  kitGrupo.add(base, kitPantalla); ponPantalla();
  if (current !== kitGrupo) { if (current) scene.remove(current); current = kitGrupo; scene.add(kitGrupo); }
  const box = new THREE.Box3().setFromObject(kitGrupo), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  shadow.scale.setScalar(Math.max(size.x, size.z)*.55); shadow.position.set(c.x, box.min.y + .01, c.z);
  controls.minDistance = 25; controls.maxDistance = size.length()*4;
  if (primera) { const d = size.length()/2 / Math.sin(THREE.MathUtils.degToRad(16));
    controls.target.copy(c); camera.position.set(c.x + d*.35, c.y + d*.12, c.z + d*.93); kitFoco = false; rotarLuego(); controls.update();
    $('focusBtn').textContent = txtVer(); }
  else if (kitFoco) vistaPantalla(); else vistaGeneral();
  $('loading').hidden = true;
}

/* ---------- descargas oficiales ---------- */
function ponDescargas(lista){
  const box = $('vDescargas'); box.innerHTML = '';
  $('vDesc2').hidden = !(lista && lista.length);
  (lista || []).forEach(([plat, url]) => { const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = plat + ' ↗'; box.appendChild(a); });
}

/* ---------- Pikmin Clicker: figura (tecla) sobre base ---------- */
const PK_SALIENTE = 0.8, PK_CUPULA = -1.5;   // mm: tapón plano asoma del borde; la cúpula se asienta en la boca
let pkGrupo = null; const pkMem = {};
async function showPikmin(it){
  init3D(); resize();
  const my = ++token; kitFoco = false; anim = null; $('focusBtn').hidden = true;
  if (current) { scene.remove(current); current = null; }
  const st = pkMem[it.id] = pkMem[it.id] || { fig: it.figuras[0].id };
  $('pkBox').hidden = false; $('pkChips').innerHTML = '';
  $('pkLabel').textContent = it.etiqueta || 'Pikmin'; $('pkLabel').hidden = $('pkChips').hidden = it.figuras.length < 2;
  it.figuras.forEach(f => { const ch = document.createElement('button'); ch.className = 'chip' + (f.id === st.fig ? ' on' : '');
    if (f.color) ch.innerHTML = `<span class="dot" style="background:${f.color}"></span>`; ch.append(f.nombre);
    ch.onclick = () => { st.fig = f.id; [...$('pkChips').children].forEach(x => x.classList.toggle('on', x === ch)); montaPikmin(it, false); };
    $('pkChips').appendChild(ch); });
  await montaPikmin(it, true, my);
}
async function montaPikmin(it, primera, my = token){
  const st = pkMem[it.id], f = it.figuras.find(x => x.id === st.fig), bdat = f.base ? it.bases[f.base] : null;
  $('pkBase').textContent = bdat ? 'Base: ' + bdat.nombre : ''; $('pkBase').hidden = !bdat;
  ponDescargas(f.descargas || it.descargas);
  const tienda = f.tienda || it.tienda; $('vShop').hidden = !tienda; if (tienda) { $('vShop').href = tienda; $('vShop').textContent = f.tiendaTexto || it.tiendaTexto || 'Ver en la tienda ›'; }
  $('loading').hidden = false; $('loading').textContent = 'Cargando modelo…';
  try {
    const [base, fig] = await Promise.all([bdat ? getModel(bdat.modelo || 'pk-base-' + f.base) : null, getModel(f.modelo || 'pk-fig-' + f.id)]);
    if (my !== token) return;
    if (!pkGrupo) pkGrupo = new THREE.Group();
    const cambioBase = !base || !pkGrupo.children.includes(base);
    pkGrupo.clear();
    fig.position.set(0, (bdat && bdat.y != null) ? bdat.y + (f.cupula ? PK_CUPULA : PK_SALIENTE) : 0, 0);
    if (base) pkGrupo.add(base); pkGrupo.add(fig);
    if (it.fijos) for (const m of await Promise.all(it.fijos.map(getModel))) { m.position.set(0, 0, 0); pkGrupo.add(m); }
    if (current !== pkGrupo) { if (current) scene.remove(current); current = pkGrupo; scene.add(pkGrupo); }
    const box = new THREE.Box3().setFromObject(pkGrupo), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
    shadow.scale.setScalar(Math.max(size.x, size.z)*.55); shadow.position.set(c.x, box.min.y + .01, c.z);
    const d = size.length()/2 / Math.sin(THREE.MathUtils.degToRad(16)) * 1.22;
    controls.minDistance = d*.4; controls.maxDistance = d*2.5;
    const az = it.vistaAz ?? 0.31, el = it.vistaEl ?? .2, pos = new THREE.Vector3(c.x + d*Math.sin(az)*.97, c.y + d*el, c.z + d*Math.cos(az)*.97);
    if (primera) { controls.target.copy(c); camera.position.copy(pos); rotarLuego(); controls.update(); }
    else if (cambioBase) moverCamara(pos, c);
    else { controls.target.copy(c); }
    $('loading').hidden = true;
  } catch(e) { console.error(e); if (my === token) $('loading').textContent = 'No se pudo cargar el modelo'; }
}

/* ---------- detalle ---------- */
function renderDetalle(key, id){
  const s = SECCIONES[key], lista = ordenados(key), i = lista.findIndex(x => x.id === id), it = lista[i];
  if (!it) return renderLista(key);
  show('visor');
  $('visorSeccion').textContent = s.titulo; pinta($('visorLogo'), A[s.logo], 120);
  $('volver').onclick = () => location.hash = '#'+key;
  $('vTag').textContent = s.tag; $('vTag').style.background = key==='impresion-3d' ? 'var(--g3d)' : 'var(--tkgreen)';
  $('vNombre').textContent = it.nombre; $('vDesc').textContent = it.desc || '';
  $('vPrecio').hidden = $('vVarBox').hidden = $('vShop').hidden = true;
  $('vColores').innerHTML = it.colores ? it.colores.map(c => `<span style="background:${c}"></span>`).join('') + `<em>${it.colores.length} ${it.colores.length===1?'color':'colores'}</em>` : '';
  const n = lista.length;
  $('prev').hidden = $('next').hidden = n < 2;
  $('prev').onclick = () => location.hash = '#'+key+'--'+lista[(i-1+n)%n].id;
  $('next').onclick = () => location.hash = '#'+key+'--'+lista[(i+1)%n].id;
  const is3d = it.tipo === '3d' || it.tipo === 'kit' || it.tipo === 'pikmin' || it.tipo === 'combo';
  $('kitBox').hidden = true; $('pkBox').hidden = true; $('focusBtn').hidden = true;
  if (it.tienda) { $('vShop').hidden = false; $('vShop').href = it.tienda; $('vShop').textContent = it.tiendaTexto || 'Ver en la tienda ›'; }
  ponDescargas(it.descargas);
  $('stage').hidden = !is3d; $('photo').hidden = is3d;
  $('stage').querySelector('.halo').style.background = `radial-gradient(circle, ${s.halo} 0, transparent 70%)`;
  if (it.tipo === '3d' && it.modelo) { show3D(it.modelo); } else if (it.tipo === 'kit') showKit(it); else if (it.tipo === 'pikmin' || it.tipo === 'combo') showPikmin(it); else if (is3d) show3D(it.id);
  else {
    $('photo').prepend($('prev')); $('photo').appendChild($('next'));
    const ponVariante = vi => {
      const v = it.variantes[vi];
      const src = (window.FOTOS||{})[v.foto]; const c = $('photoImg');
      if (src) requestAnimationFrame(() => pinta(c, src, 0, true)); else { c.width = c.height = 1; cargaFotos(key).then(() => { if (location.hash.endsWith('--'+it.id)) ponVariante(vi); }); }
      $('vPrecio').hidden = false; $('vPrecio').textContent = v.precio;
      $('vDesc').textContent = v.desc || '';
      $('vShop').hidden = !v.url; if (v.url) $('vShop').href = v.url;
      [...$('vChips').children].forEach((ch, j) => ch.classList.toggle('on', j === vi));
    };
    $('vChips').innerHTML = '';
    if (it.variantes.length > 1) {
      $('vVarBox').hidden = false; $('vVarLabel').textContent = it.variantes.length + ' variantes';
      it.variantes.forEach((v, j) => { const ch = document.createElement('button'); ch.className = 'chip'; ch.textContent = v.nombre; ch.onclick = () => ponVariante(j); $('vChips').appendChild(ch); });
    }
    ponVariante(0);
  }
  if (is3d && $('prev').parentNode !== $('stage')) { $('stage').append($('prev'), $('next')); }
}

/* ---------- rutas por #hash ---------- */
function route(){
  const h = location.hash.slice(1);
  if (SECCIONES[h]) return renderLista(h);
  const m = h.match(/^([a-z0-9-]+?)--([a-z0-9-]+)$/);
  if (m && SECCIONES[m[1]]) return renderDetalle(m[1], m[2]);
  show('home');
}
pinta($('logoG3'), A.logo_garder3d, 360); pinta($('logoTk'), A.logo_teckel, 360);
addEventListener('hashchange', route); route();

/* ---------- sin descargas: clic derecho, arrastrar, guardar ---------- */
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('dragstart', e => e.preventDefault());
addEventListener('selectstart', e => { if (!e.target.closest || !e.target.closest('input')) e.preventDefault(); });
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && (k === 's' || k === 'p' || k === 'u')) e.preventDefault();
});
